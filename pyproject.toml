[project]
name = "librarian"
version = "0.1.0"
description = "An agent that knows everything about the documents you give it."
readme = "README.md"
authors = [
    { name = "ermir", email = "7790756+ermirbeqiraj@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "docling-core>=2.99",
    "httpx>=0.28.1",
    "langchain-mistralai>=1.1.6",
    "mcp>=2.3.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "simplejson>=4.2.0",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
librarian-ingest = "librarian.hosts.ingest:main"
librarian-ask = "librarian.hosts.ask:main"
librarian-trace = "librarian.hosts.trace:main"
librarian-serve = "librarian.hosts.mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.alembic]
script_location = "%(here)s/librarian/adapters/postgres/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
