name: librarian

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: librarian
      POSTGRES_PASSWORD: librarian
      POSTGRES_DB: librarian
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/extensions.sql:/docker-entrypoint-initdb.d/extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librarian -d librarian"]
      interval: 5s
      timeout: 3s
      retries: 10

  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.36.0
    environment:
      # A 21-page bill takes ~120s on CPU, the default limit; matches the reader's 300s timeout.
      DOCLING_SERVE_MAX_SYNC_WAIT: 300
    # A big contract took the Docker VM down through docling; the cap kills docling instead.
    # 6g is a first guess: raise it if a document it should read gets killed.
    mem_limit: 6g
    ports:
      - "127.0.0.1:5001:5001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  bge-m3:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    command: --model-id BAAI/bge-m3 --max-batch-tokens 2048
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - hf-models:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  aspire:
    # The live trace view: the evals (and any host app) OTLP-export to the
    # published 18889, the UI answers on 18888. Read-only, nothing persists.
    image: mcr.microsoft.com/dotnet/aspire-dashboard
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:18889:18889"
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

  ingest:
    build:
      context: ../src
      dockerfile: Dockerfile.dev
    image: librarian-dotnet-dev
    command: ["Ingest.dll"]
    environment:
      # Config comes from the app's own files, carried by the mounted build output.
      DOTNET_ENVIRONMENT: Development
    # Host network: the config files' 127.0.0.1 links reach the compose services.
    network_mode: host
    volumes:
      # The host's build output is the app; a rebuild needs only a container restart.
      - ../src/librarian/Ingest/bin/Debug/net10.0:/app:ro
      # The dev root at the same absolute path — ingest is the only app that writes the library.
      - ${HOME}/.local/share/librarian-dotnet-dev:${HOME}/.local/share/librarian-dotnet-dev
      # The dev root's instructions/ points outside the mount; this binds the same path from the
      # host — where the link resolves — so the files exist where the app looks for them.
      - ${HOME}/.local/share/librarian-dotnet-dev/instructions:${HOME}/.local/share/librarian-dotnet-dev/instructions:ro
    depends_on:
      postgres:
        condition: service_healthy
    # No HTTP endpoint: the health is its log tick; a restart re-scans the inbox.
    restart: unless-stopped

  api:
    build:
      context: ../src
      dockerfile: Dockerfile.dev
    image: librarian-dotnet-dev
    command: ["Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      # The host's build output is the app; a rebuild needs only a container restart.
      - ../src/librarian/Api/bin/Debug/net10.0:/app:ro
      # The dev root, read-only: the ask's instructions live there, and the Api never writes the library.
      - ${HOME}/.local/share/librarian-dotnet-dev:${HOME}/.local/share/librarian-dotnet-dev:ro
      # The dev root's instructions/ points outside the mount; this binds the same path from the
      # host — where the link resolves — so the files exist where the app looks for them.
      - ${HOME}/.local/share/librarian-dotnet-dev/instructions:${HOME}/.local/share/librarian-dotnet-dev/instructions:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  hf-models:
