name: librarian

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: librarian
      POSTGRES_PASSWORD: librarian
      POSTGRES_DB: librarian
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/extensions.sql:/docker-entrypoint-initdb.d/extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librarian -d librarian"]
      interval: 5s
      timeout: 3s
      retries: 10

  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.36.0
    environment:
      # A 21-page bill takes ~120s on CPU, the default limit; matches the reader's 300s timeout.
      DOCLING_SERVE_MAX_SYNC_WAIT: 300
    # A big contract took the Docker VM down through docling; the cap kills docling instead.
    # 6g is a first guess: raise it if a document it should read gets killed.
    mem_limit: 6g
    ports:
      - "127.0.0.1:5001:5001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  bge-m3:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    command: --model-id BAAI/bge-m3 --max-batch-tokens 2048
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - hf-models:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  hf-models:
