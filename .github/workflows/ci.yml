name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    # Unit tests only: the Postgres-backed tests (the Postgres collection and the ingest
    # worker round-trip) run locally against the compose stack, never here.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore --locked-mode
        working-directory: dotnet

      - name: Build
        run: dotnet build Librarian.slnx --no-restore
        working-directory: dotnet

      - name: Unit tests
        run: >-
          dotnet run --project tests/Librarian.Tests --no-build --
          -namespace- Librarian.Tests.Postgres
          -class- Librarian.Tests.Ingest.WorkerTests
        working-directory: dotnet

  image:
    # The image must build; on a push to main it also publishes to GHCR
    # (latest for the homeserver to pull, the commit sha to roll back to).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: dotnet
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
